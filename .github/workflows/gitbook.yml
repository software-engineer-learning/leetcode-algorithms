name: GitBook

# GitBook publishes this repo through Git sync (.gitbook.yaml -> SUMMARY.md), so
# whatever lands on main is what readers see — there is no build step in between
# to catch a stale table of contents or a link to a folder that was renamed.
# This workflow is that missing build step:
#
#   * on pull requests -> validate only, so a bad TOC never reaches main
#   * on push to main  -> regenerate the navigation, commit any drift, then
#                         call the swe-site deploy hook
#
# Regenerating on main is what actually "updates GitBook": the commit this job
# makes is the trigger. No GitBook API token is involved.
#
# The swe-site rebuild is triggered from here, at the end of the publish job,
# rather than from its own workflow. Chaining it guarantees swe-site pulls the
# regenerated SUMMARY.md instead of racing the commit that fixes it. This
# replaces the old trigger-site-deploy.yml.
#
# The rebuild goes through a GitHub repository_dispatch at swe-site, which is
# what swe-site/.github/workflows/deploy.yml listens for. That workflow runs
# build.sh, which clones all four content repos, runs scripts/prepare.sh and
# mkdocs build, then uploads the result with `wrangler pages deploy`.
#
# Do NOT swap this back to a Cloudflare Pages deploy hook. swe-site is a Direct
# Upload project, so a hook has no repo to clone and no build command to run --
# it re-serves the already-uploaded assets, which looks like a successful deploy
# while the content stays stale. Deploy hooks only build on Git-connected Pages
# projects, and connecting swe-site would run its build twice.
#
# The bot commit does not re-run this workflow: GitHub suppresses workflow
# triggers for pushes made with the default GITHUB_TOKEN, so there is no loop.

on:
  push:
    branches: [main]
    paths:
      - "Easy/**"
      - "Medium/**"
      - "Hard/**"
      - "README.md"
      - "SUMMARY.md"
      - "_sidebar.md"
      - ".gitbook.yaml"
      - ".gitbook/**"
      - "tools/**"
      - ".github/workflows/gitbook.yml"
  pull_request:
    paths:
      - "Easy/**"
      - "Medium/**"
      - "Hard/**"
      - "README.md"
      - "SUMMARY.md"
      - "_sidebar.md"
      - ".gitbook.yaml"
      - ".gitbook/**"
      - "tools/**"
      - ".github/workflows/gitbook.yml"
  workflow_dispatch:

# Never let two runs race to commit regenerated navigation.
concurrency:
  group: gitbook-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate GitBook sources
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check navigation, links, counts and math
        run: ./tools/check-nav.sh

      - name: Explain how to fix
        if: failure()
        run: |
          echo "::notice::Run './tools/gen-summary.sh && ./tools/gen-sidebar.sh && ./tools/mathfix.py' locally, then commit the result."

  publish:
    name: Regenerate navigation and sync
    # Guarded on main so a manual run from a branch never pushes a commit there.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # A real token is needed so the commit below is pushed as a normal
          # commit that GitBook's Git sync app can see.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize math for GitBook
        run: ./tools/mathfix.py

      - name: Regenerate SUMMARY.md and _sidebar.md
        run: |
          ./tools/gen-summary.sh
          ./tools/gen-sidebar.sh

      - name: Commit drift, if any
        id: commit
        run: |
          if git diff --quiet; then
            echo "Navigation already up to date; nothing to push."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SUMMARY.md _sidebar.md Easy Medium Hard
          git commit -m "Regenerate GitBook navigation"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Verify the state GitBook will sync
        run: ./tools/check-nav.sh

      - name: Trigger swe-site rebuild
        env:
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "${SITE_DISPATCH_TOKEN}" ]; then
            echo "::error::SITE_DISPATCH_TOKEN is not set — swe-site will not rebuild."
            echo "Create a classic PAT with the 'repo' scope on an account that can write to"
            echo "software-engineer-learning/swe-site, then save it as an organisation secret"
            echo "named SITE_DISPATCH_TOKEN so every content repo picks it up at once."
            exit 1
          fi

          # No -f: it discards the response body, and GitHub explains a refusal there.
          resp="$(mktemp)"
          code="$(curl -sS -X POST \
            -o "$resp" -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${SITE_DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/software-engineer-learning/swe-site/dispatches \
            -d "{\"event_type\":\"content-updated\",\"client_payload\":{\"repo\":\"${GITHUB_REPOSITORY}\",\"sha\":\"${GITHUB_SHA}\"}}")"

          # A successful dispatch is 204 with an empty body.
          if [ "$code" = "204" ]; then
            echo "Dispatch accepted — swe-site is rebuilding."
            exit 0
          fi

          echo "GitHub returned HTTP $code"
          echo "--- response body ---"
          cat "$resp"; echo

          case "$code" in
            401)
              echo "::error::Token rejected (401). SITE_DISPATCH_TOKEN is expired, revoked or truncated — regenerate it and update the organisation secret." ;;
            403)
              echo "::error::Token refused (403). It lacks write access to swe-site. A classic PAT needs the 'repo' scope; a fine-grained PAT needs 'Contents: read and write' on swe-site AND the organisation must allow fine-grained tokens (Org settings -> Personal access tokens). If the org enforces SAML SSO, authorise the token for it." ;;
            404)
              echo "::error::Repository not found (404). GitHub returns 404 rather than 403 when the token cannot see swe-site at all — check the token's repository access." ;;
            422)
              echo "::error::Dispatch rejected (422). The payload was malformed, or swe-site's deploy.yml no longer listens for the 'content-updated' event type." ;;
            *)
              echo "::error::Dispatch failed with HTTP $code." ;;
          esac
          exit 1

      - name: Summary
        run: |
          {
            echo "### GitBook sync"
            echo
            if [ "${{ steps.commit.outputs.changed }}" = "true" ]; then
              echo "Navigation had drifted; regenerated and pushed a commit."
              echo "GitBook Git sync picks this up on the new push."
            else
              echo "Navigation was already correct — GitBook syncs this commit as-is."
            fi
            echo
            echo "Fired the content-updated dispatch at swe-site."
          } >> "$GITHUB_STEP_SUMMARY"
