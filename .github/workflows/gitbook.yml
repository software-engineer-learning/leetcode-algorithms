name: GitBook

# GitBook publishes this repo through Git sync (.gitbook.yaml -> SUMMARY.md), so
# whatever lands on main is what readers see — there is no build step in between
# to catch a stale table of contents or a link to a folder that was renamed.
# This workflow is that missing build step:
#
#   * on pull requests -> validate only, so a bad TOC never reaches main
#   * on push to main  -> regenerate the navigation, commit any drift, then
#                         call the swe-site deploy hook
#
# Regenerating on main is what actually "updates GitBook": the commit this job
# makes is the trigger. No GitBook API token is involved.
#
# The swe-site rebuild is triggered from here, at the end of the publish job,
# rather than from its own workflow. Chaining it guarantees swe-site pulls the
# regenerated SUMMARY.md instead of racing the commit that fixes it. This
# replaces the old trigger-site-deploy.yml.
#
# The rebuild goes through a Cloudflare Pages deploy hook rather than a GitHub
# repository_dispatch. A deploy hook is an unguessable URL that needs no token,
# so there is nothing to scope to an owner and nothing that expires -- the
# previous PAT approach could not work at all, because swe-site belongs to the
# software-engineer-learning org while the token was owned by a user account.
#
# The bot commit does not re-run this workflow: GitHub suppresses workflow
# triggers for pushes made with the default GITHUB_TOKEN, so there is no loop.

on:
  push:
    branches: [main]
    paths:
      - "Easy/**"
      - "Medium/**"
      - "Hard/**"
      - "README.md"
      - "SUMMARY.md"
      - "_sidebar.md"
      - ".gitbook.yaml"
      - ".gitbook/**"
      - "tools/**"
      - ".github/workflows/gitbook.yml"
  pull_request:
    paths:
      - "Easy/**"
      - "Medium/**"
      - "Hard/**"
      - "README.md"
      - "SUMMARY.md"
      - "_sidebar.md"
      - ".gitbook.yaml"
      - ".gitbook/**"
      - "tools/**"
      - ".github/workflows/gitbook.yml"
  workflow_dispatch:

# Never let two runs race to commit regenerated navigation.
concurrency:
  group: gitbook-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate GitBook sources
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check navigation, links, counts and math
        run: ./tools/check-nav.sh

      - name: Explain how to fix
        if: failure()
        run: |
          echo "::notice::Run './tools/gen-summary.sh && ./tools/gen-sidebar.sh && ./tools/mathfix.py' locally, then commit the result."

  publish:
    name: Regenerate navigation and sync
    # Guarded on main so a manual run from a branch never pushes a commit there.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # A real token is needed so the commit below is pushed as a normal
          # commit that GitBook's Git sync app can see.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize math for GitBook
        run: ./tools/mathfix.py

      - name: Regenerate SUMMARY.md and _sidebar.md
        run: |
          ./tools/gen-summary.sh
          ./tools/gen-sidebar.sh

      - name: Commit drift, if any
        id: commit
        run: |
          if git diff --quiet; then
            echo "Navigation already up to date; nothing to push."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SUMMARY.md _sidebar.md Easy Medium Hard
          git commit -m "Regenerate GitBook navigation"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Verify the state GitBook will sync
        run: ./tools/check-nav.sh

      - name: Trigger swe-site rebuild
        env:
          SITE_DEPLOY_HOOK: ${{ secrets.SITE_DEPLOY_HOOK }}
        run: |
          if [ -z "${SITE_DEPLOY_HOOK}" ]; then
            echo "::error::SITE_DEPLOY_HOOK is not set — swe-site will not rebuild."
            echo "Create one in the Cloudflare dashboard: Workers & Pages -> swe-site ->"
            echo "Settings -> Builds & deployments -> Deploy hooks. Save the whole URL as"
            echo "the SITE_DEPLOY_HOOK secret; the URL itself is the credential."
            exit 1
          fi

          # No -f: it discards the response body, and Cloudflare reports the
          # reason for a failure there. The hook takes no auth header and no
          # payload -- possession of the URL is the authorisation, which is why
          # it must never be echoed.
          resp="$(mktemp)"
          code="$(curl -sS -X POST -o "$resp" -w '%{http_code}' "${SITE_DEPLOY_HOOK}")"

          if [ "$code" = "200" ] && grep -q '"success":[[:space:]]*true' "$resp"; then
            echo "Deploy hook accepted — swe-site is rebuilding."
            exit 0
          fi

          echo "Cloudflare returned HTTP $code"
          echo "--- response body ---"
          cat "$resp"; echo

          case "$code" in
            401|403)
              echo "::error::Deploy hook rejected ($code). The hook was probably deleted or regenerated in the Cloudflare dashboard — create a new one and update the SITE_DEPLOY_HOOK secret." ;;
            404)
              echo "::error::Deploy hook not found (404). The stored URL points at a hook that no longer exists, or the secret is truncated. Re-copy the full URL from Cloudflare." ;;
            *)
              echo "::error::Deploy hook call failed with HTTP $code." ;;
          esac
          exit 1

      - name: Summary
        run: |
          {
            echo "### GitBook sync"
            echo
            if [ "${{ steps.commit.outputs.changed }}" = "true" ]; then
              echo "Navigation had drifted; regenerated and pushed a commit."
              echo "GitBook Git sync picks this up on the new push."
            else
              echo "Navigation was already correct — GitBook syncs this commit as-is."
            fi
            echo
            echo "Called the swe-site deploy hook."
          } >> "$GITHUB_STEP_SUMMARY"
